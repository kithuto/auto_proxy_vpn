[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto_proxy_vpn"
version = "0.2.3"
description = "A package to create on demand proxies and vpns in different cloud providers."
keywords = ["vpn", "proxy", "networking", "cloud", "security", "web scrapping"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["requests"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Security",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://kithuto.github.io/auto_proxy_vpn/readme.html"
Repository = "https://github.com/kithuto/auto_proxy_vpn"
Documentation = "https://kithuto.github.io/auto_proxy_vpn/readme.html"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "responses",
    "python-dotenv",
]
google = ["google-cloud-compute"]
azure = [
    "azure-identity",
    "azure-mgmt-subscription",
    "azure-mgmt-resource",
    "azure-mgmt-network",
    "azure-mgmt-compute",
]
aws = ["boto3"]
all = [
    "google-cloud-compute",
    "azure-identity",
    "azure-mgmt-subscription",
    "azure-mgmt-resource",
    "azure-mgmt-network",
    "azure-mgmt-compute",
    "boto3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests with mocked dependencies (run by default)",
    "integration: Integration tests requiring real cloud credentials (skipped by default)",
    "digitalocean: Tests requiring a DigitalOcean token",
    "google: Tests requiring Google Cloud credentials",
    "azure: Tests requiring Azure credentials",
    "aws: Tests requiring AWS credentials",
    "pool: Real tests for the ProxyPool class",
]
addopts = [
    "-v",
    "--strict-markers",
    "-m", "not integration",
    "--tb=short",
]

[tool.coverage.run]
source = ["auto_proxy_vpn"]
omit = ["tests/*", "docs/*", ".github/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
