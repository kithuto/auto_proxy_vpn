name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '.github/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version-check:
    name: Check Package Version Change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      previous_version: ${{ steps.version.outputs.previous_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare pyproject version with previous main revision
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          def read_version(text: str) -> str:
              return tomllib.loads(text)["project"]["version"]

          package_version = read_version(Path("pyproject.toml").read_text(encoding="utf-8"))

          previous = ""
          before = os.environ.get("BEFORE_SHA", "")
          if before and before != "0" * 40:
              result = subprocess.run(
                  ["git", "show", f"{before}:pyproject.toml"],
                  capture_output=True,
                  check=False,
                  text=True,
              )
              if result.returncode == 0:
                  previous = read_version(result.stdout)

          changed = previous != package_version
          print(f"version={package_version}")
          print(f"previous_version={previous}")
          print(f"changed={str(changed).lower()}")
          PY

  unit-tests:
    name: Unit Tests (Python 3.14)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox

      - name: Run unit tests
        run: |
          python -m tox -e py314 -- tests/unit/ -v --tb=short --junitxml=junit-results.xml --cov=auto_proxy_vpn --cov-report=xml

      - name: Run quality checks
        run: python -m tox -e lint,coverage,docs,audit

  build:
    name: Build Distributions
    runs-on: ubuntu-latest
    needs:
      - version-check
      - unit-tests
    if: needs.version-check.outputs.changed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox

      - name: Build package
        run: python -m tox -e package

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-artifacts
          path: dist/*

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - version-check
      - build
    if: needs.version-check.outputs.changed == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-artifacts
          path: dist

      - name: Ensure tag does not already exist
        run: |
          TAG="v${{ needs.version-check.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Bump the package version before releasing."
            exit 1
          fi

      - name: Create and push git tag
        run: |
          TAG="v${{ needs.version-check.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version-check.outputs.version }}
          name: Release v${{ needs.version-check.outputs.version }}
          generate_release_notes: true
          files: dist/*

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - version-check
      - release
    if: needs.version-check.outputs.changed == 'true'
    permissions:
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-artifacts
          path: dist

      - name: Publish package to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
