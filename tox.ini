[tox]
env_list =
    lint
    py310
    py311
    py312
    py313
    py314
    coverage
    docs
    package
    audit

[testenv]
extras = test
commands =
    pytest {posargs:tests/unit/}

[testenv:coverage]
extras = test
commands =
    pytest --cov=auto_proxy_vpn --cov-report=term-missing {posargs:tests/unit/}

[testenv:lint]
package = skip
deps =
    ruff
commands =
    ruff format --check .
    ruff check .

[testenv:docs]
extras = test
deps =
    myst-parser
    sphinx
    sphinx-rtd-theme
commands =
    sphinx-build -b html docs docs/_build/html

[testenv:package]
package = skip
deps =
    build
    twine
commands_pre =
    python -c "import shutil, pathlib; shutil.rmtree('dist', ignore_errors=True); shutil.rmtree('build', ignore_errors=True); [shutil.rmtree(path, ignore_errors=True) for path in pathlib.Path('.').glob('*.egg-info')]"
commands =
    python -m build
    python -m twine check dist/*
    python -c "import pathlib, zipfile; wheels = sorted(pathlib.Path('dist').glob('auto_proxy_vpn-*.whl')); assert wheels, 'wheel not built'; names = zipfile.ZipFile(wheels[-1]).namelist(); assert 'auto_proxy_vpn/__init__.py' in names, 'wheel does not contain auto_proxy_vpn package'; assert not any('__pycache__' in name or name.startswith(('docs/_build/', '.tox/')) for name in names), 'wheel contains generated artifacts'"

[testenv:audit]
extras =
    test
deps =
    pip-audit
commands_pre =
    python -m pip install --upgrade pip
commands =
    python -m pip_audit --skip-editable
